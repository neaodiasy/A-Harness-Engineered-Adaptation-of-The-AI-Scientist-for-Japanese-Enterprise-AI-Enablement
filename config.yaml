model:
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  cheap_model: deepseek-v4-pro
  strong_model: deepseek-v4-pro
  temperature: 0.1
  max_tokens: 12000
  timeout_seconds: 120
  retries: 2
  thinking:
    enabled: true
    reasoning_effort: high
  stage_models:
    consultation: strong
    opportunity_generation: strong
    feasibility_check: strong
    candidate_search: strong
    agent_design: strong
    software_factory: strong
    proposal: strong
    review: strong
output_dir: outputs/<timestamp>_api_run
consultation_output: outputs/<timestamp>_api_run/01_consulting/consultation_result.json
generated_app_dir: outputs/<timestamp>_api_run/02_generated_app
live_search:
  enabled_env: ENABLE_LIVE_SEARCH
  provider: duckduckgo_html
  trusted_domains:
    - meti.go.jp
    - ipa.go.jp
    - digital.go.jp
    - fsa.go.jp
    - boj.or.jp
    - mhlw.go.jp
    - mlit.go.jp
    - gsi.go.jp
    - oecd.org
